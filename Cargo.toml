[package]
name = "mousehmd"
version = "0.2.0"
edition = "2021"
description = "SteamVR virtual HMD driver whose orientation is driven by mouse/keyboard"
license = "MIT"
publish = false

[lib]
name = "driver_mousehmd"
crate-type = ["cdylib"]

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = "1"

[profile.release]
panic = "abort"
lto = true
